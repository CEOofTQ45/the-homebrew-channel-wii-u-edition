name: Build Wii U Homebrew
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Wii U dependencies
        run: |
          # The container is already authenticated. Just fetch the extra libraries
          dkp-pacman -S --noconfirm wut-tools wiiu-portlibs wiiu-sdl2

      - name: Build App
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/WiiU.cmake ..
          make

      - name: Upload Finished WUHB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: my_launcher_bundle
          path: build/*.wuhb
