name: Build Wii U Homebrew
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Wii U dependencies
        run: |
          # Force pacman to ignore security signatures in the container
          sed -i 's/SigLevel = Required/SigLevel = Never/g' /etc/pacman.conf
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm wut-tools wiiu-portlibs wiiu-sdl2

      - name: Build App
        run: |
          mkdir build && cd build
          powerpc-eabi-cmake ..
          make

      - name: Upload Finished WUHB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: my_launcher_bundle
          path: build/*.wuhb
